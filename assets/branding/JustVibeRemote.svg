<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">JustVibe Remote dark app icon</title>
  <desc id="desc">A silver remote with a microphone button in front of abstract code bars on a dark rounded square.</desc>
  <defs>
    <linearGradient id="tile" x1="160" y1="60" x2="860" y2="970" gradientUnits="userSpaceOnUse">
      <stop stop-color="#41495F"/>
      <stop offset=".44" stop-color="#252A3C"/>
      <stop offset="1" stop-color="#171827"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="150" y1="60" x2="880" y2="970" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3ACBF" stop-opacity=".65"/>
      <stop offset=".4" stop-color="#626A80" stop-opacity=".12"/>
      <stop offset="1" stop-color="#85839E" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="code" x1="160" y1="200" x2="880" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A4A2BD"/>
      <stop offset="1" stop-color="#64617F"/>
    </linearGradient>
    <linearGradient id="metal" x1="382" y1="170" x2="651" y2="856" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFCFD"/>
      <stop offset=".28" stop-color="#E3E4E5"/>
      <stop offset=".6" stop-color="#D6D8D9"/>
      <stop offset="1" stop-color="#BFC2C5"/>
    </linearGradient>
    <linearGradient id="metalEdge" x1="380" y1="170" x2="650" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF"/>
      <stop offset=".48" stop-color="#E2E4E6"/>
      <stop offset="1" stop-color="#9FA4A8"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#454545"/>
      <stop offset=".5" stop-color="#262627"/>
      <stop offset="1" stop-color="#151516"/>
    </linearGradient>
    <linearGradient id="buttonEdge" x1="0" y1="0" x2=".4" y2="1">
      <stop stop-color="#A3A3A3"/>
      <stop offset=".4" stop-color="#3B3B3C"/>
      <stop offset="1" stop-color="#787879"/>
    </linearGradient>
    <filter id="remoteShadow" x="-30%" y="-15%" width="160%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#06070F" flood-opacity=".5"/>
    </filter>
    <g id="smallButton">
      <circle r="40" fill="#171719" stroke="#F4F4F5" stroke-width="2"/>
      <circle r="36" fill="url(#button)" stroke="url(#buttonEdge)" stroke-width="2"/>
    </g>
  </defs>

  <!-- Transparent canvas outside the macOS-style tile. -->
  <g id="background">
    <rect x="52" y="52" width="920" height="920" rx="184" fill="url(#tile)"/>
    <rect x="53" y="53" width="918" height="918" rx="183" stroke="url(#tileEdge)" stroke-width="2"/>
  </g>

  <!-- Abstract code: editable bars, with no embedded text or bitmap. -->
  <g id="abstract-code" fill="url(#code)" opacity=".65">
    <rect x="152" y="212" width="590" height="80" rx="40"/>
    <rect x="256" y="326" width="636" height="80" rx="40" opacity=".65"/>
    <rect x="256" y="326" width="540" height="80" rx="40"/>
    <rect x="182" y="440" width="600" height="76" rx="38"/>
    <rect x="158" y="546" width="554" height="76" rx="38"/>
    <rect x="258" y="652" width="596" height="76" rx="38" opacity=".65"/>
    <rect x="258" y="652" width="526" height="76" rx="38"/>
  </g>

  <g id="remote" filter="url(#remoteShadow)">
    <rect x="376" y="170" width="272" height="700" rx="58" fill="url(#metalEdge)"/>
    <rect x="381" y="175" width="262" height="690" rx="54" fill="url(#metal)" stroke="#F8F8F9" stroke-opacity=".75" stroke-width="2"/>
    <rect x="386" y="180" width="252" height="680" rx="50" stroke="#FFF" stroke-opacity=".25" stroke-width="2"/>

    <g id="navigation-pad">
      <circle cx="512" cy="333" r="105" fill="#181819" stroke="#F7F7F8" stroke-width="2"/>
      <circle cx="512" cy="333" r="100" fill="url(#button)" stroke="url(#buttonEdge)" stroke-width="3"/>
      <path d="M441 267a99 99 0 0 1 142 0" stroke="#FFF" stroke-opacity=".12" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g id="buttons">
      <use href="#smallButton" x="460" y="490"/>
      <use href="#smallButton" x="564" y="490"/>
      <use href="#smallButton" x="460" y="590"/>
      <use href="#smallButton" x="460" y="690"/>
      <g id="rocker">
        <rect x="524" y="550" width="80" height="180" rx="40" fill="#171719" stroke="#F4F4F5" stroke-width="2"/>
        <rect x="528" y="554" width="72" height="172" rx="36" fill="url(#button)" stroke="url(#buttonEdge)" stroke-width="2"/>
      </g>
    </g>

    <g id="microphone" fill="#F9F9FA" stroke="#F9F9FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="455" y="473" width="10" height="23" rx="5" stroke="none"/>
      <path d="M449 488v5a11 11 0 0 0 22 0v-5M460 504v8m-7 0h14" fill="none"/>
    </g>
  </g>
</svg>
