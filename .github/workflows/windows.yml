name: Windows support checks
on:
  workflow_dispatch:
  push:
    paths: ['windows/**', 'plugins/**', 'assets/fonts/**', 'scripts/test-windows-ui.ps1', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'plugins/**', 'assets/fonts/**', 'scripts/test-windows-ui.ps1', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Portable feature checks
        run: dotnet run --project windows/JustVibeRemote.Tests -- .
      - name: Build native UI
        run: dotnet build windows/JustVibeRemote.App -c Release
      - name: Native page and setup previews
        shell: pwsh
        run: ./scripts/test-windows-ui.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-verification
          path: build/windows-ui-verification
      - name: Publish x64
        run: dotnet publish windows/JustVibeRemote.App -c Release -r win-x64 --self-contained true -o dist/windows-win-x64
      - name: Publish ARM64
        run: dotnet publish windows/JustVibeRemote.App -c Release -r win-arm64 --self-contained true -o dist/windows-win-arm64
